<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Load Safety Gate</title>
<style>
  :root { --bg:#0f1419; --card:#1a2129; --fg:#e8edf2; --muted:#8a97a5; --go:#2ea84a; --warn:#f0a020; --nogo:#e03a3a; --skip:#6b7680; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:1.4rem; margin:8px 0 2px; }
  .sub { color:var(--muted); margin:0 0 16px; font-size:.95rem; }
  .card { background:var(--card); border-radius:12px; padding:16px; margin-bottom:14px; }
  label.btn, button { display:inline-block; background:#2b6cb0; color:#fff; border:0; border-radius:10px; padding:12px 18px; font-size:1rem; cursor:pointer; }
  input[type=file] { display:none; }
  .examples button { background:#2d3742; margin:4px 4px 0 0; padding:8px 12px; font-size:.9rem; }
  #verdict { font-size:2rem; font-weight:700; padding:10px 16px; border-radius:10px; text-align:center; }
  .GO { background:var(--go);} .WARN { background:var(--warn); color:#111;} .NO-GO { background:var(--nogo);} .CANNOT { background:var(--skip);}
  table { width:100%; border-collapse:collapse; margin-top:10px; }
  td, th { text-align:left; padding:8px 6px; border-bottom:1px solid #2d3742; font-size:.95rem; }
  .pass { color:var(--go);} .warn { color:var(--warn);} .fail { color:var(--nogo);} .skip { color:var(--skip);}
  img#out { width:100%; border-radius:10px; margin-top:10px; }
  .meta { color:var(--muted); font-size:.85rem; margin-top:8px; }
  #spin { display:none; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Load Safety Gate</h1>
  <p class="sub">Photo of a loaded truck at the gate → GO / NO-GO. Body roll, overhang, height. Plates and people are blurred before anything is shown.</p>

  <div class="card">
    <label class="btn" for="file">📷 Take or choose a photo</label>
    <input id="file" type="file" accept="image/*" capture="environment">
    <span id="spin">&nbsp; analysing…</span>
    {% if examples %}
    <div class="examples" style="margin-top:10px">
      <span class="meta">Or run the live pipeline on an example:</span><br>
      {% for e in examples %}<button onclick="runExample('{{e}}')">{{ e }}</button>{% endfor %}
    </div>
    {% endif %}
  </div>

  <div class="card" id="result" style="display:none">
    <div id="verdict"></div>
    <table id="checks"></table>
    <img id="out" alt="annotated result">
    <div class="meta" id="meta"></div>
    <div class="meta" id="notes"></div>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const fd = new FormData(); fd.append('file', f);
  await run(fetch('/analyse', {method:'POST', body:fd}));
});
async function runExample(name){ await run(fetch('/analyse/example/'+name)); }
async function run(p){
  $('#spin').style.display='inline'; $('#result').style.display='none';
  try {
    const r = await (await p).json();
    const v = $('#verdict'); v.textContent = r.verdict; v.className = r.verdict.split(' ')[0];
    $('#checks').innerHTML = '<tr><th>Check</th><th>Value</th><th>Status</th><th>Conf.</th><th>Why</th></tr>' +
      r.checks.map(c=>`<tr class="${c.status}"><td>${c.name}</td><td>${c.value}</td><td>${c.status}</td><td>${c.confidence}</td><td>${c.reason}</td></tr>`).join('');
    $('#out').src = 'data:image/jpeg;base64,' + r.image_b64;
    $('#meta').textContent = `view: ${r.view} · scale: ${r.scale_source} · ${r.timings_ms.total} ms on ${r.device} · ${r.privacy_regions_blurred} privacy region(s) blurred`;
    $('#notes').textContent = r.notes.length ? 'notes: ' + r.notes.join(' · ') : '';
    $('#result').style.display='block';
  } catch(err){ alert('Error: '+err); }
  $('#spin').style.display='none';
}
</script>
</body>
</html>
