# Load Safety Gate — pipeline configuration
detector:
  model: yolov8s-worldv2.pt          # open-vocabulary detector, no training needed
  prompts: [truck, trailer, cargo, car, wheel, container, tarpaulin]
  conf: 0.15
  imgsz: 640
  device: cpu                         # production target; override with env LSG_DEVICE=cuda
privacy:
  model: yolov8n.pt                   # fallback: person boxes; plate model set in code
  blur_persons: true
  blur_plates: true
scale:
  trailer_width_m: 2.55               # legal max body width (EU / CIS standard)
  wheel_diameter_m: 1.05              # typical truck tyre outer diameter
thresholds:                           # Uzbekistan: Cabinet of Ministers Decree No. 342 (26.12.2011), Annex 2:
                                      # oversized if height > 4.0 m, width > 2.55 m (2.6 m refrigerated),
                                      # or cargo protrudes > 2 m beyond the rear of the body. Source: gov.uz/ru/uzavtoyul/sections/view/48313
  roll_min_conf: 0.5                 # below this the roll check is skipped, not reported
  roll_warn_deg: 4.0
  roll_oblique_min_conf: 0.35       # oblique view: a reading >= roll_fail_deg at this confidence is a WARN, never a fail
  roll_fail_deg: 7.0
  side_overhang_fail_cm: 20           # cargo wider than body by this -> NO-GO
  rear_overhang_warn_cm: 100          # must be marked beyond this
  rear_overhang_fail_cm: 200          # legal max rear overhang
  max_height_m: 4.0                   # legal max vehicle height
  height_margin_m: 0.4                # uncalibrated phone photos: fail only above limit + margin
  height_min_conf: 0.6
  height_implausible_m: 8.0        # above this the scale is wrong, not the truck: report as cannot assess
  overhang_min_conf: 0.5
  load_lean_warn_deg: 5.0             # stacked load above the body (rear view). Our own thresholds: no regulation
  load_lean_fail_deg: 10.0            # covers stack lean, so they are stated as ours on the deck
  load_spread_warn_deg: 8.0           # stack wider at the top than at the body
  load_min_conf: 0.5
  min_truck_box_frac: 0.15            # truck must occupy >= this fraction of image width
